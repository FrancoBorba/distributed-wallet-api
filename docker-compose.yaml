version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: wager_db
    environment:
      POSTGRES_USER: wager_user
      POSTGRES_PASSWORD: wager_password
      POSTGRES_DB: wager_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager_user -d wager_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.4
    container_name: wager_keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db

  # Keycloak DB
  keycloak_db:
    image: postgres:15-alpine
    container_name: keycloak_db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data

  # Local SQS  
  localstack:
    image: localstack/localstack:2.3
    container_name: wager_sqs
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  postgres_data:
  keycloak_data: